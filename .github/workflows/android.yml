name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Cari zip di akar repositori, ekstrak, lalu temukan folder proyek (yang berisi settings.gradle.kts)
      - name: Ekstrak zip proyek
        run: |
          ZIP=$(ls -t *.zip 2>/dev/null | head -1)
          if [ -z "$ZIP" ]; then echo "Tidak ada file .zip di akar repositori"; exit 1; fi
          echo "Memakai $ZIP"
          mkdir -p _src && unzip -q -o "$ZIP" -d _src
          S=$(find _src -name settings.gradle.kts -not -path "*/node_modules/*" | head -1)
          if [ -z "$S" ]; then echo "settings.gradle.kts tidak ditemukan di dalam zip"; exit 1; fi
          echo "PROJ=$(dirname "$S")" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      # Tes pencocokan dengan versi web. Gagal tidak menghentikan pembuatan APK, laporannya diunggah.
      - name: Unit test
        continue-on-error: true
        run: gradle -p "$PROJ" testDebugUnitTest --stacktrace

      - name: Bangun APK debug
        run: gradle -p "$PROJ" assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: EnduranceVault-debug-apk
          path: ${{ env.PROJ }}/app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: laporan-tes
          path: ${{ env.PROJ }}/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
