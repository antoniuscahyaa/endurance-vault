name: Build EnduranceVault Native APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - '*.zip'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract native Android project
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$(ls -1t -- ./*.zip 2>/dev/null | head -n 1 || true)"
          if [[ -z "${ZIP}" || ! -f "${ZIP}" ]]; then
            echo "::error::Tidak ditemukan file ZIP proyek di akar repository."
            exit 1
          fi

          echo "Menggunakan paket: ${ZIP}"
          mkdir -p _src
          unzip -q -o "${ZIP}" -d _src

          SETTINGS_FILE="$(find _src -type f -name settings.gradle.kts -not -path '*/node_modules/*' -print -quit)"
          if [[ -z "${SETTINGS_FILE}" ]]; then
            echo "::error::settings.gradle.kts tidak ditemukan di dalam ZIP."
            exit 1
          fi

          PROJECT_DIR="$(dirname "${SETTINGS_FILE}")"
          if [[ ! -f "${PROJECT_DIR}/app/build.gradle.kts" ]]; then
            echo "::error::app/build.gradle.kts tidak ditemukan pada ${PROJECT_DIR}."
            exit 1
          fi

          echo "Proyek Android: ${PROJECT_DIR}"
          echo "PROJECT_DIR=${PROJECT_DIR}" >> "${GITHUB_ENV}"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install persistent signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          # Nilai dibaca dari GitHub Secrets; jika kosong, pakai default lama
          # agar build tetap jalan selama masa transisi.
          STORE_PASS="${KEYSTORE_PASSWORD:-android}"
          ALIAS="${KEY_ALIAS:-androiddebugkey}"
          KEY_PASS="${KEY_PASSWORD:-${STORE_PASS}}"

          if [[ -z "${KEYSTORE_PASSWORD}" || -z "${KEY_ALIAS}" || -z "${KEY_PASSWORD}" ]]; then
            echo "::warning::Secret KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD belum lengkap; memakai nilai default."
          fi

          if [[ -z "${KEYSTORE_BASE64}" ]]; then
            echo "::error::GitHub Secret KEYSTORE_BASE64 belum diatur pada repository native."
            exit 1
          fi

          mkdir -p "${HOME}/.android"
          printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > "${HOME}/.android/debug.keystore"

          if [[ ! -s "${HOME}/.android/debug.keystore" ]]; then
            echo "::error::Keystore hasil decode kosong atau tidak valid."
            exit 1
          fi

          keytool -list \
            -keystore "${HOME}/.android/debug.keystore" \
            -storepass "${STORE_PASS}" \
            -alias "${ALIAS}" > /dev/null

          echo "ANDROID_KEYSTORE_PATH=${HOME}/.android/debug.keystore" >> "${GITHUB_ENV}"
          echo "ANDROID_KEYSTORE_PASSWORD=${STORE_PASS}" >> "${GITHUB_ENV}"
          echo "ANDROID_KEY_ALIAS=${ALIAS}" >> "${GITHUB_ENV}"
          echo "ANDROID_KEY_PASSWORD=${KEY_PASS}" >> "${GITHUB_ENV}"

          echo "Persistent keystore berhasil dipasang dan diverifikasi."
          keytool -list -v \
            -keystore "${HOME}/.android/debug.keystore" \
            -storepass "${STORE_PASS}" \
            -alias "${ALIAS}" | grep -E 'SHA1:|SHA256:'

      - name: Verify release configuration
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'applicationId = "com.endurancevault.app"' "${PROJECT_DIR}/app/build.gradle.kts"
          grep -q 'signingConfig = signingConfigs.getByName("release")' "${PROJECT_DIR}/app/build.gradle.kts"
          test -s "${HOME}/.android/debug.keystore"
          echo "Package name, release signing config, and persistent keystore are present."

      - name: Run unit tests (required)
        run: gradle -p "${PROJECT_DIR}" testDebugUnitTest --stacktrace

      - name: Build signed release APK
        run: gradle -p "${PROJECT_DIR}" assembleRelease --stacktrace

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find "${PROJECT_DIR}/app/build/outputs/apk/release" -maxdepth 1 -type f -name '*.apk' -print -quit)"
          if [[ -z "${APK}" ]]; then
            echo "::error::APK release tidak ditemukan setelah build."
            exit 1
          fi

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "${SDK_ROOT}" ]]; then
            echo "::error::ANDROID_HOME/ANDROID_SDK_ROOT tidak tersedia."
            exit 1
          fi
          BUILD_TOOLS="${SDK_ROOT}/build-tools"
          APKSIGNER="$(find "${BUILD_TOOLS}" -type f -name apksigner 2>/dev/null | sort -V | tail -n 1)"
          if [[ -z "${APKSIGNER}" ]]; then
            echo "::error::apksigner tidak ditemukan."
            exit 1
          fi

          "${APKSIGNER}" verify --verbose "${APK}"

          APK_SHA="$("${APKSIGNER}" verify --print-certs "${APK}" | awk '/certificate SHA-256 digest/ {print tolower($NF); exit}' | tr -d ':')"
          KEY_SHA="$(keytool -list -v \
            -keystore "${HOME}/.android/debug.keystore" \
            -storepass "${ANDROID_KEYSTORE_PASSWORD}" \
            -alias "${ANDROID_KEY_ALIAS}" | awk '/SHA256:/ {print tolower($2); exit}' | tr -d ':')"

          echo "APK certificate SHA-256     : ${APK_SHA}"
          echo "Keystore certificate SHA-256: ${KEY_SHA}"

          if [[ -z "${APK_SHA}" || -z "${KEY_SHA}" || "${APK_SHA}" != "${KEY_SHA}" ]]; then
            echo "::error::Sertifikat APK tidak cocok dengan KEYSTORE_BASE64."
            exit 1
          fi

          echo "### APK signing verification" >> "${GITHUB_STEP_SUMMARY}"
          echo "SHA-256: ${APK_SHA}" >> "${GITHUB_STEP_SUMMARY}"
          echo "APK release: ${APK}" >> "${GITHUB_STEP_SUMMARY}"
          echo "APK_PATH=${APK}" >> "${GITHUB_ENV}"
          sha256sum "${APK}" | tee "${APK}.sha256"
          echo "CHECKSUM_PATH=${APK}.sha256" >> "${GITHUB_ENV}"

      - name: Upload EnduranceVault APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: EnduranceVault-native-release-apk
          path: |
            ${{ env.APK_PATH }}
            ${{ env.CHECKSUM_PATH }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EnduranceVault-unit-test-report
          path: ${{ env.PROJECT_DIR }}/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14
