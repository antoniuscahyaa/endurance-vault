name: Build EnduranceVault Native APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - '*.zip'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract native Android project
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$(find . -maxdepth 1 -type f -name '*.zip' -printf '%T@ %p\\n' | sort -nr | head -n 1 | cut -d' ' -f2-)"
          if [[ -z "${ZIP}" ]]; then
            echo "::error::Tidak ditemukan ZIP proyek di akar repository."
            exit 1
          fi

          echo "Menggunakan paket: ${ZIP}"
          mkdir -p _src
          unzip -q -o "${ZIP}" -d _src

          SETTINGS_FILE="$(find _src -type f -name settings.gradle.kts -not -path '*/node_modules/*' -print -quit)"
          if [[ -z "${SETTINGS_FILE}" ]]; then
            echo "::error::settings.gradle.kts tidak ditemukan di dalam ZIP."
            exit 1
          fi

          PROJECT_DIR="$(dirname "${SETTINGS_FILE}")"
          if [[ ! -f "${PROJECT_DIR}/app/build.gradle.kts" ]]; then
            echo "::error::app/build.gradle.kts tidak ditemukan pada ${PROJECT_DIR}."
            exit 1
          fi

          echo "Proyek Android: ${PROJECT_DIR}"
          echo "PROJECT_DIR=${PROJECT_DIR}" >> "${GITHUB_ENV}"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Gunakan secret yang sama dengan repository aplikasi lama.
      # Format keystore lama: debug.keystore / android / androiddebugkey.
      - name: Install persistent signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          if [[ -z "${KEYSTORE_BASE64}" ]]; then
            echo "::error::GitHub Secret KEYSTORE_BASE64 belum diatur pada repository native."
            exit 1
          fi

          mkdir -p "${HOME}/.android"
          printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > "${HOME}/.android/debug.keystore"

          if [[ ! -s "${HOME}/.android/debug.keystore" ]]; then
            echo "::error::Keystore hasil decode kosong atau tidak valid."
            exit 1
          fi

          keytool -list \
            -keystore "${HOME}/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey > /dev/null

          echo "Keystore persisten berhasil dipasang dan diverifikasi."
          keytool -list -v \
            -keystore "${HOME}/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey | grep -E 'SHA1:|SHA256:'

      - name: Run unit tests
        continue-on-error: true
        run: gradle -p "${PROJECT_DIR}" testDebugUnitTest --stacktrace

      - name: Build signed debug APK
        run: gradle -p "${PROJECT_DIR}" assembleDebug --stacktrace

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find "${PROJECT_DIR}/app/build/outputs/apk/debug" -maxdepth 1 -type f -name '*.apk' -print -quit)"
          if [[ -z "${APK}" ]]; then
            echo "::error::APK debug tidak ditemukan setelah build."
            exit 1
          fi

          BUILD_TOOLS="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}/build-tools"
          APKSIGNER="$(find "${BUILD_TOOLS}" -type f -name apksigner | sort -V | tail -n 1)"
          if [[ -z "${APKSIGNER}" ]]; then
            echo "::error::apksigner tidak ditemukan."
            exit 1
          fi

          "${APKSIGNER}" verify --verbose "${APK}"

          APK_SHA="$("${APKSIGNER}" verify --print-certs "${APK}" | awk '/certificate SHA-256 digest/ {print tolower($NF); exit}' | tr -d ':')"
          KEY_SHA="$(keytool -list -v \
            -keystore "${HOME}/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey | awk '/SHA256:/ {print tolower($2); exit}' | tr -d ':')"

          echo "APK certificate SHA-256     : ${APK_SHA}"
          echo "Keystore certificate SHA-256: ${KEY_SHA}"

          if [[ -z "${APK_SHA}" || -z "${KEY_SHA}" || "${APK_SHA}" != "${KEY_SHA}" ]]; then
            echo "::error::Sertifikat APK tidak cocok dengan KEYSTORE_BASE64."
            exit 1
          fi

          echo "### APK signing verification" >> "${GITHUB_STEP_SUMMARY}"
          echo "SHA-256: \`${APK_SHA}\`" >> "${GITHUB_STEP_SUMMARY}"
          echo "APK: \`${APK}\`" >> "${GITHUB_STEP_SUMMARY}"
          echo "APK_PATH=${APK}" >> "${GITHUB_ENV}"

      - name: Upload EnduranceVault APK
        uses: actions/upload-artifact@v4
        with:
          name: EnduranceVault-native-debug-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EnduranceVault-unit-test-report
          path: ${{ env.PROJECT_DIR }}/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14
