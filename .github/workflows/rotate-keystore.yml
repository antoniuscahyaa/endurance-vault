name: Rotate keystore password (sekali pakai)

# Mengganti password keystore, alias, dan password key TANPA mengubah sertifikat tanda tangan.
# Jalankan manual (Actions -> Rotate keystore password -> Run workflow), lalu hapus workflow ini.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Rotate keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          NEW_KEYSTORE_PASSWORD: ${{ secrets.NEW_KEYSTORE_PASSWORD }}
          NEW_KEY_ALIAS: ${{ secrets.NEW_KEY_ALIAS }}
          NEW_KEY_PASSWORD: ${{ secrets.NEW_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          OLD_STORE="${KEYSTORE_PASSWORD:-android}"
          OLD_ALIAS="${KEY_ALIAS:-androiddebugkey}"
          OLD_KEY="${KEY_PASSWORD:-${OLD_STORE}}"

          for v in NEW_KEYSTORE_PASSWORD NEW_KEY_ALIAS NEW_KEY_PASSWORD KEYSTORE_BASE64; do
            if [[ -z "${!v:-}" ]]; then
              echo "::error::Secret ${v} belum diatur."
              exit 1
            fi
          done
          if [[ ${#NEW_KEYSTORE_PASSWORD} -lt 6 || ${#NEW_KEY_PASSWORD} -lt 6 ]]; then
            echo "::error::Password baru minimal 6 karakter."
            exit 1
          fi
          if [[ "${NEW_KEY_ALIAS}" =~ [[:space:]] ]]; then
            echo "::error::Alias baru tidak boleh mengandung spasi."
            exit 1
          fi

          W="$(mktemp -d)"
          printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > "${W}/lama.keystore"
          [[ -s "${W}/lama.keystore" ]] || { echo "::error::KEYSTORE_BASE64 tidak valid."; exit 1; }

          sha_of() { # keystore storepass alias
            keytool -list -v -keystore "$1" -storepass "$2" -alias "$3" | awk '/SHA256:/ {print tolower($2); exit}' | tr -d ':'
          }

          OLD_SHA="$(sha_of "${W}/lama.keystore" "${OLD_STORE}" "${OLD_ALIAS}")"
          [[ -n "${OLD_SHA}" ]] || { echo "::error::Keystore lama tidak bisa dibuka dengan KEYSTORE_PASSWORD/KEY_ALIAS saat ini."; exit 1; }

          TYPE="$(keytool -list -v -keystore "${W}/lama.keystore" -storepass "${OLD_STORE}" | awk -F': ' '/Keystore type:/ {print toupper($2); exit}')"
          echo "Tipe keystore: ${TYPE}"

          if [[ "${TYPE}" == "PKCS12" && "${NEW_KEY_PASSWORD}" != "${NEW_KEYSTORE_PASSWORD}" ]]; then
            echo "::error::Keystore berformat PKCS12: KEY_PASSWORD harus sama dengan KEYSTORE_PASSWORD. Isi NEW_KEY_PASSWORD sama dengan NEW_KEYSTORE_PASSWORD."
            exit 1
          fi

          cp "${W}/lama.keystore" "${W}/baru.keystore"
          keytool -storepasswd -keystore "${W}/baru.keystore" -storepass "${OLD_STORE}" -new "${NEW_KEYSTORE_PASSWORD}"

          if [[ "${TYPE}" == "PKCS12" ]]; then
            if [[ "${NEW_KEY_ALIAS}" != "${OLD_ALIAS}" ]]; then
              keytool -changealias -keystore "${W}/baru.keystore" -storepass "${NEW_KEYSTORE_PASSWORD}" -alias "${OLD_ALIAS}" -destalias "${NEW_KEY_ALIAS}"
            fi
          else
            if [[ "${NEW_KEY_ALIAS}" != "${OLD_ALIAS}" ]]; then
              keytool -changealias -keystore "${W}/baru.keystore" -storepass "${NEW_KEYSTORE_PASSWORD}" -alias "${OLD_ALIAS}" -destalias "${NEW_KEY_ALIAS}" -keypass "${OLD_KEY}"
            fi
            keytool -keypasswd -keystore "${W}/baru.keystore" -storepass "${NEW_KEYSTORE_PASSWORD}" -alias "${NEW_KEY_ALIAS}" -keypass "${OLD_KEY}" -new "${NEW_KEY_PASSWORD}"
          fi

          # Verifikasi 1: sertifikat tidak berubah
          NEW_SHA="$(sha_of "${W}/baru.keystore" "${NEW_KEYSTORE_PASSWORD}" "${NEW_KEY_ALIAS}")"
          echo "SHA-256 lama: ${OLD_SHA}"
          echo "SHA-256 baru: ${NEW_SHA}"
          if [[ -z "${NEW_SHA}" || "${OLD_SHA}" != "${NEW_SHA}" ]]; then
            echo "::error::Sertifikat berubah atau tidak terbaca. Proses dihentikan, tidak ada hasil yang dibuat."
            exit 1
          fi

          # Verifikasi 2: password key benar-benar bisa membuka kunci privat
          keytool -importkeystore -noprompt \
            -srckeystore "${W}/baru.keystore" -srcstorepass "${NEW_KEYSTORE_PASSWORD}" \
            -srcalias "${NEW_KEY_ALIAS}" -srckeypass "${NEW_KEY_PASSWORD}" \
            -destkeystore "${W}/uji.p12" -deststoretype PKCS12 -deststorepass "${NEW_KEYSTORE_PASSWORD}" > /dev/null
          echo "Password key baru berhasil membuka kunci privat."

          mkdir -p hasil
          base64 -w0 "${W}/baru.keystore" > hasil/keystore-baru.b64.txt
          {
            echo "### Rotasi keystore berhasil"
            echo "SHA-256 (sama dengan sebelumnya): ${NEW_SHA}"
            echo ""
            echo "Langkah berikutnya: unduh artifact keystore-baru, isi secret KEYSTORE_BASE64 dengan isi file itu,"
            echo "lalu ubah KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD ke nilai baru. Setelah itu hapus artifact,"
            echo "tiga secret NEW_*, dan workflow ini."
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          echo "Selesai."

      - name: Upload keystore baru (Base64, 1 hari)
        uses: actions/upload-artifact@v4
        with:
          name: keystore-baru
          path: hasil/keystore-baru.b64.txt
          if-no-files-found: error
          retention-days: 1
